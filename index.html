<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Samuel Petrony, Jr. · AI Enablement &amp; Adoption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root {
  --serif: 'Instrument Serif', serif;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --bg: #FAFBFD;
  --surface: #FFFFFF;
  --surface-alt: #F1F5F9;
  --ink: #0B2560;
  --text: #1E293B;
  --muted: #64748B;
  --accent: #0B45B5;
  --accent-soft: rgba(11, 69, 181, 0.08);
  --on-accent: #FFFFFF;
  --line: #E2E8F0;
  --rule: #0B2560;
  --panel: transparent;
  --panel-shadow: none;
  --panel-m: 0;
  --bevel: none;
  --radius: 8px;
  --radius-sm: 4px;
  --hdr-bg: rgba(250, 251, 253, 0.88);
  --hdr-fg: var(--text);
  --hdr-ink: var(--ink);
  --btn-bg: #FFFFFF;
  --btn-fg: var(--ink);
  --link: var(--accent);
  --card-shadow: 0 1px 3px rgba(11, 37, 96, 0.04), 0 1px 2px rgba(11, 37, 96, 0.02);
  --card-shadow-hover: 0 14px 28px -6px rgba(11, 37, 96, 0.1), 0 4px 10px -2px rgba(11, 37, 96, 0.05);
}

:root[data-theme="dark"] {
  --bg: #090D16;
  --surface: #111827;
  --surface-alt: #1E293B;
  --ink: #F1F5F9;
  --text: #CBD5E1;
  --muted: #94A3B8;
  --accent: #6E9BFF;
  --accent-soft: rgba(110, 155, 255, 0.12);
  --on-accent: #090D16;
  --line: #1E293B;
  --rule: #334155;
  --hdr-bg: rgba(9, 13, 22, 0.88);
  --btn-bg: #111827;
  --btn-fg: #F1F5F9;
  --card-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  --card-shadow-hover: 0 14px 28px -6px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--accent);
}

:root[data-theme="retro"] {
  --serif: 'Times New Roman', Times, serif;
  --mono: 'Courier New', Courier, monospace;
  --sans: Verdana, Tahoma, Geneva, sans-serif;
  --bg: #008080;
  --panel: #C0C0C0;
  --surface: #FFFFFF;
  --surface-alt: #DFDFDF;
  --ink: #000080;
  --text: #000000;
  --muted: #3A3A3A;
  --accent: #000080;
  --accent-soft: #DFDFDF;
  --on-accent: #FFFFFF;
  --line: #808080;
  --rule: #000080;
  --link: #0000EE;
  --radius: 0px;
  --radius-sm: 0px;
  --panel-m: 20px;
  --panel-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #fff, inset -2px -2px 0 #808080, inset 2px 2px 0 #DFDFDF;
  --bevel: inset -1px -1px 0 #000, inset 1px 1px 0 #fff, inset -2px -2px 0 #808080, inset 2px 2px 0 #DFDFDF;
  --hdr-bg: linear-gradient(90deg, #000080, #1084D0);
  --hdr-fg: #FFFFFF;
  --hdr-ink: #FFFFFF;
  --btn-bg: #C0C0C0;
  --btn-fg: #000000;
  --card-shadow: var(--bevel);
  --card-shadow-hover: var(--bevel);
}

html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  transition: background .25s, color .25s;
}
* { box-sizing: border-box; }
img { display: block; max-width: 100%; }

a {
  color: var(--link);
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color .2s, border-color .2s, background-color .2s, transform .2s, box-shadow .2s;
}
a:hover { color: var(--ink); }

/* Header & Navigation */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--hdr-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  transition: background .25s, border-color .25s;
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px clamp(20px, 4vw, 48px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.nav-links {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.nav-link {
  color: var(--hdr-fg);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
}
.nav-link:hover {
  background: var(--accent-soft);
  color: var(--accent);
}
:root[data-theme="retro"] .nav-link:hover {
  background: #000080;
  color: #FFFFFF;
}

/* Theme Switcher */
.theme-group {
  display: flex;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--surface-alt);
  padding: 2px;
  gap: 2px;
}
:root[data-theme="retro"] .theme-group {
  padding: 0;
  gap: 0;
  background: transparent;
}
.theme-btn {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  padding: 6px 12px;
  border: 0;
  border-radius: calc(var(--radius-sm) - 1px);
  cursor: pointer;
  box-shadow: var(--bevel);
  transition: background .15s, color .15s;
}

/* Hero Section */
.hero {
  padding: clamp(48px, 7vw, 88px) 0 56px;
  display: flex;
  flex-wrap: wrap;
  gap: clamp(32px, 5vw, 64px);
  align-items: center;
}
.eyebrow-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid rgba(11, 69, 181, 0.15);
}
:root[data-theme="retro"] .eyebrow-badge {
  border-radius: 0;
  border: 1px solid var(--line);
}
.eyebrow-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  text-decoration: none;
  padding: 13px 22px;
  border-radius: var(--radius-sm);
  box-shadow: var(--bevel);
  cursor: pointer;
  transition: transform .15s, opacity .15s, background-color .2s, border-color .2s, color .2s;
}
.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
  border: 1px solid var(--accent);
}
.btn-primary:hover {
  color: var(--on-accent);
  opacity: .92;
  transform: translateY(-1px);
}
.btn-secondary {
  background: var(--btn-bg);
  color: var(--btn-fg);
  border: 1px solid var(--line);
}
.btn-secondary:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.copy-badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
:root[data-theme="retro"] .copy-badge {
  border-radius: 0;
}
.hero-figure {
  margin: 0;
  min-width: 0;
  flex: 1.3 1 360px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--surface);
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
}
.hero-figure img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  object-position: 70% center;
  border-radius: calc(var(--radius) - 4px);
}

/* Section Headings & Accordion Trigger */
.sec-wrap {
  padding: 72px 0 16px;
  scroll-margin-top: 72px;
}
.sec-toggle {
  all: unset;
  cursor: pointer;
  box-sizing: border-box;
  width: 100%;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
  margin-bottom: 36px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.sec-toggle:hover .sec-pill {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.sec-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 999px;
  box-shadow: var(--bevel);
  transition: all .2s;
  white-space: nowrap;
}
:root[data-theme="retro"] .sec-pill {
  border-radius: 0;
  background: var(--btn-bg);
  color: var(--btn-fg);
}

/* About Bento Cards */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
  gap: 24px;
}
.bento-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--card-shadow);
}
.bento-title {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--accent);
}
.clean-list {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 15px;
  line-height: 1.65;
}
.clean-list li::marker {
  color: var(--accent);
}

/* Experience Timeline */
.exp-group {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 48px;
  padding: 32px 0;
  border-bottom: 1px solid var(--line);
}
.exp-sidebar {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1 1 220px;
}
.exp-timeline {
  flex: 3 1 480px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  border-left: 2px solid var(--line);
  padding-left: clamp(20px, 3vw, 32px);
  margin-left: 6px;
}
.exp-item {
  position: relative;
  padding-bottom: 28px;
}
.exp-item:last-child {
  padding-bottom: 4px;
}
.exp-item + .exp-item {
  padding-top: 24px;
  border-top: 1px dashed var(--line);
}
.exp-dot {
  position: absolute;
  left: calc(-1 * clamp(20px, 3vw, 32px) - 6px);
  top: 6px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--muted);
}
.exp-item + .exp-item .exp-dot {
  top: 30px;
}
.exp-dot.current {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.exp-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  align-items: baseline;
  margin-bottom: 12px;
}
.exp-role {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}
.exp-date {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
:root[data-theme="retro"] .exp-date {
  border-radius: 0;
}

/* Expertise & Tools */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
  gap: 20px;
}
.tool-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: var(--card-shadow);
}
.tool-chip {
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface-alt);
}

/* Certifications & Education Rows */
.cred-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  flex-wrap: wrap;
}

/* Projects Grid (3x2 on desktop) */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 28px;
}
.project-card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--card-shadow);
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.project-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--card-shadow-hover);
  border-color: var(--accent);
  color: var(--text);
}
